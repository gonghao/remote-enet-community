name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -timeout 120s ./...
      - name: Test offline tooling
        run: |
          python3 -B -m unittest discover -s tools -p 'test_*.py'
          sh -n tools/build-macos-client.sh
      - name: Test conformance generators
        env:
          CONFORMANCE_LOCAL_PAKE: "1"
        run: |
          python3 -B -m unittest discover -s testdata/conformance/gen -p 'test_*.py'
          python3 -B testdata/conformance/gen/run_all.py --check
      - name: Scan for private markers
        env:
          REPO_GUARD_RULES_INLINE: ${{ secrets.REPO_GUARD_RULES_INLINE }}
        run: python3 -B tools/repo-guard.py

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -timeout 120s ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: arm64
            ext: ""
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -tags mygo_nowebview ./...
      - name: Build Client and Operator
        shell: bash
        run: |
          mkdir -p build
          desktop_ldflags=""
          if [ "$GOOS" = "windows" ]; then
            desktop_ldflags="-H=windowsgui"
          fi
          go build -tags mygo_nowebview -ldflags "$desktop_ldflags" -o build/renet-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/renet-client
          go build -tags mygo_nowebview -ldflags "$desktop_ldflags" -o build/renet-operator-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/renet-operator
          go build -trimpath -o build/renet-labprobe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/renet-labprobe
          go build -trimpath -o build/renet-hub-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/renet-hub
      - name: Verify macOS packaging without publishing binaries
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          python3 -B tools/build-desktop.py --platform darwin --role all --output build/packages

  native-sockets:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native sockets and local process ownership
        run: go test -count=1 -timeout 60s -run '^TestNative' ./internal/udpdiscovery ./internal/exclusive ./internal/operator ./internal/integration
      - name: Test native lifecycle and packet forwarding
        run: go test -tags mygo_nowebview -count=1 -timeout 120s ./internal/settings ./internal/trust ./internal/checkup ./internal/desktop ./internal/desktopui ./internal/ui ./internal/brand ./internal/brand/cmd/brandassets ./internal/locales ./internal/secure ./internal/packetio ./internal/mgu ./internal/l3 ./internal/tunadapter ./internal/netpriv ./internal/diagnostics ./internal/hsfzcapture ./cmd/renet-labprobe ./cmd/renet-net-helper ./cmd/renet-tuncheck ./cmd/renet-client ./cmd/renet-operator
